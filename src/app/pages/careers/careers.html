<ng-container *transloco="let t; read: 'careers'">
    <section class="hero-section">
        <div class="container hero-content text-center">
            <h1 class="hero-title" appScrollReveal>{{ t('title') }}</h1>
            <p class="hero-subtitle" appScrollReveal>{{ t('subtitle') }}</p>
            <div class="hero-divider"></div>
        </div>
    </section>

    <section class="careers-content">
        <div class="container">
            <div class="intro-text" appScrollReveal>
                <p>{{ t('intro') }}</p>
            </div>

            <!-- Loading State -->
            <div *ngIf="isLoadingJobs" class="loading-state">
                <div class="spinner"></div>
                <p>{{ t('loading') }}</p>
            </div>

            <!-- Job List -->
            <div *ngIf="!isLoadingJobs" class="job-grid" @staggerAnimation>
                <div *ngFor="let job of jobs; let i = index" class="job-card" (click)="openApplicationModal(job)">
                    <div class="job-card-inner">
                        <div class="job-card-accent"></div>
                        <div class="job-card-body">
                            <div class="job-card-header">
                                <div class="job-icon-wrapper">
                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
                                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
                                    </svg>
                                </div>
                                <h3 class="job-title">{{ t(job.titleKey) }}</h3>
                            </div>

                            <p class="job-description">{{ t(job.shortDescKey) }}</p>

                            <div class="job-card-footer">
                                <span class="apply-cta">
                                    {{ t('applyButton') }}
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="m9 18 6-6-6-6" />
                                    </svg>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</ng-container>

<!-- Application Modal -->
<app-job-application-modal *ngIf="isModalOpen" [jobTitle]="selectedJobTitle" (close)="closeApplicationModal()"
    (submitApplication)="onApplicationSubmit($event)">
</app-job-application-modal>
