<ng-container *transloco="let t; read: 'careers'">
    <section class="hero-section">
        <div class="container hero-content text-center">
            <h1 class="hero-title" appScrollReveal>{{ t('title') }}</h1>
            <p class="hero-subtitle" appScrollReveal>{{ t('subtitle') }}</p>
            <div class="hero-divider"></div>
        </div>
    </section>

    <section class="careers-content">
        <div class="container">
            <div class="intro-text" appScrollReveal>
                <p>{{ t('intro') }}</p>
            </div>

            <!-- Loading State -->
            <div *ngIf="isLoadingJobs" class="loading-state">
                <div class="spinner"></div>
                <p>{{ t('loading') }}</p>
            </div>

            <!-- Job List -->
            <!-- Cada cartão tem UMA coisa interactiva: o botão «Candidatar-me». O ::after dele
                 estica-se por cima do cartão inteiro, por isso clicar em qualquer ponto continua
                 a abrir a candidatura — e o teclado chega lá com Tab. O cartão não pode ser ele
                 próprio um <button>: leva um <h3>, e um botão só aceita conteúdo de frase. -->
            <ul *ngIf="!isLoadingJobs" class="job-grid" role="list" @staggerAnimation>
                <li *ngFor="let job of jobs; let i = index" class="job-card">
                    <div class="job-card-inner">
                        <div class="job-card-accent"></div>
                        <div class="job-card-body">
                            <div class="job-card-header">
                                <div class="job-icon-wrapper" aria-hidden="true">
                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
                                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
                                    </svg>
                                </div>
                                <h3 class="job-title">{{ t(job.titleKey) }}</h3>
                            </div>

                            <p class="job-description">{{ t(job.shortDescKey) }}</p>

                            <div class="job-card-footer">
                                <!-- O título da vaga vai no nome do botão: seis «Candidatar-me» iguais
                                     numa lista de botões não dizem a quem se candidata. O nome inteiro é
                                     um só pedaço escondido: partido em dois, o Chrome metia um espaço
                                     antes dos dois pontos («Candidatar-me : …»). -->
                                <button type="button" class="apply-cta" (click)="openApplicationModal(job, $event)">
                                    <span aria-hidden="true">{{ t('applyButton') }}</span>
                                    <span class="sr-only">{{ t('applyButton') }}: {{ t(job.titleKey) }}</span>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                        aria-hidden="true" focusable="false">
                                        <path d="m9 18 6-6-6-6" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </section>
</ng-container>

<!-- Application Modal -->
<app-job-application-modal *ngIf="isModalOpen" [jobTitle]="selectedJobTitle" (close)="closeApplicationModal()"
    (submitApplication)="onApplicationSubmit($event)">
</app-job-application-modal>
